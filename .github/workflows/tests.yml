name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  base:
    env:
      OMP_NUM_THREADS: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m lafc.runner.run_policy --policy lru --trace data/example_unweighted.json --capacity 3
